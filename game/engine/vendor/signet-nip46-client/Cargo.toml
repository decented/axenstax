[package]
name = "signet-nip46-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Thin NIP-46 bunker signer for Rust — pair / sign / restore over nostr-connect. Generic; ships sensible defaults for the Signet/Heartwood bunker flow."
license = "MIT"
repository = "https://github.com/forgesworn/signet-nip46-client"
homepage = "https://github.com/forgesworn/signet-nip46-client"
documentation = "https://docs.rs/signet-nip46-client"
readme = "README.md"
keywords = ["nostr", "nip46", "signer", "bunker", "signet"]
categories = ["cryptography", "authentication", "api-bindings"]

[dependencies]
# rust-nostr family, pinned in lockstep (see the AxeNStax S0 spike). NIP-46 bunker
# client + the NostrSigner trait this crate re-exposes.
nostr = "=0.44.3"
nostr-connect = "=0.44.1"
# Relay transport for our own client-initiated (`nostrconnect://`) handshake —
# rust-nostr 0.44's NostrConnect only accepts a literal "ack" there, while current
# NIP-46 has the signer return the URI `secret` (see VENDOR.md). Same lockstep pin.
nostr-relay-pool = "=0.44.1"
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt"] }
# Constant-time compare of the connect secret echo.
subtle = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
