# cargo-about config — generates THIRD-PARTY-NOTICES.txt for the native
# packages (see .github/workflows/native-packages.yml).
#
# Run from `game/engine/` (that's where Cargo.lock lives):
#   cargo about generate ../../tools/packaging/about.hbs \
#     -c ../../tools/packaging/about.toml \
#     -o ../../tools/packaging/staging/THIRD-PARTY-NOTICES.txt
#
# Licence allow-list matches the `cargo deny check licenses` allow-list in
# check.sh (tools/packaging/deny.toml) — see
# docs/audits/2026-09-28-pre-public-audit.md §3 A #12. Non-MIT/Apache/BSD
# outliers in the whole dependency graph, called out here on purpose so a
# reviewer doesn't have to go hunting for them in the generated output:
#   - attohttpc @ 0.30.1        — MPL-2.0
#   - epaint_default_fonts      — OFL-1.1 AND Ubuntu-font-1.0 (bundled fonts)
#   - libfuzzer-sys             — MIT/Apache-2.0 AND NCSA (see note below —
#                                 not actually in the shipped binary)
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "NCSA",
]

# Only the binary's own dependency graph ships in the package — build-time
# and dev-only crates never end up in the artefact, so their licences don't
# belong in a THIRD-PARTY-NOTICES file about what's inside it.
#
# In practice `ignore-dev-dependencies` only excludes the ROOT crate's own
# dev-dependencies, not a transitive dependency's dev-dependencies deep in
# the graph — confirmed 2026-09-28: `libfuzzer-sys` (a dev-dependency of
# `rav1e`, pulled in only via `rav1e -> ravif -> image -> arboard ->
# egui-winit`'s optional AVIF clipboard support, never compiled into
# axenstax-engine) still shows up and has to be allow-listed above rather
# than excluded. `cargo tree -i libfuzzer-sys` from game/engine/ confirms it
# resolves to nothing in the real build graph.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Multiple crates in this graph publish a licence WITHOUT an SPDX
# `license-file`/copyright header cargo-about can find automatically (or
# have no `license` field cargo-about can parse with confidence). If
# `cargo about generate` errors out naming any of those, add a
# `[<crate-name>.clarify]` block here pointing at the correct licence text
# rather than loosening the accepted list — see the cargo-about book,
# "Clarifying licenses".
