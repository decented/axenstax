# cargo-deny config — licence gate only (`cargo deny check licenses`, wired
# into check.sh). Keeps the licence audit current instead of a one-time scan:
# a future crate bump pulling in GPL/AGPL/SSPL fails the build instead of
# going unnoticed. See docs/audits/2026-09-28-pre-public-audit.md §3 A #12.
#
# Allow-list matches tools/packaging/about.toml's `accepted` list — anything
# NOT on this list (including "no licence found") fails the check by default;
# that's the intended behaviour, not an oversight.
#
# Run from game/engine/ (where Cargo.lock lives) — NOTE: cargo-deny's top-level
# `-c` is `--color`, not config; the config flag is `--config` with no short form:
#   (cd game/engine && cargo deny --config ../../tools/packaging/deny.toml check licenses)

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    # Found running the real check against the current dependency graph
    # (2026-09-28) — narrower than the pre-public audit's own list, which
    # missed these two because cargo-deny requires EVERY clause of an
    # AND-combined SPDX expression to be individually allowed, not just one:
    "Ubuntu-font-1.0", # epaint_default_fonts bundles a Ubuntu font alongside its MIT/Apache-2.0/OFL-1.1 fonts.
    "NCSA",            # libfuzzer-sys, pulled in only as a dev-dependency of rav1e (an optional AVIF codec dep via arboard's clipboard-image support) — never actually compiled into axenstax-engine, but cargo-deny has no dev-dependency exclusion (see note below) so it's still walked.
]
confidence-threshold = 0.8

# Unlike about.toml, this doesn't exclude build/dev-only dependencies — cargo-deny
# has no direct equivalent to cargo-about's ignore-build-dependencies /
# ignore-dev-dependencies flags as of v2 config. That means this gate is
# deliberately a bit stricter than the THIRD-PARTY-NOTICES generator: it also
# catches a disallowed licence on a dev/build-only crate before it can ever
# become a runtime dependency.
