<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Axe'n'Stax{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/axenstax-icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">Axe'n'Stax</a>
        <div class="nav-links">
            <a href="/">Home</a>
            {% for sec in sections %}
            <a href="/docs/{{ sec.slug }}">{{ sec.title }}</a>
            {% endfor %}
            <a href="/roadmap">Roadmap</a>
            <a href="/download">Download</a>
            <a href="/help">Help</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer style="text-align:center;padding:1.2rem;opacity:0.7;font-size:0.85rem;">
        <a href="{{ marketing_url }}/privacy">Privacy</a>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
