version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are pinned to full commit SHAs (see the workflow files) with a
    # version-tag comment — Dependabot updates both the SHA and the comment
    # together, so the pin stays meaningful.

  - package-ecosystem: "cargo"
    directory: "/game/engine"
    schedule:
      interval: "weekly"
    groups:
      # naga must move in lockstep with wgpu (same major), or the shader
      # front-end and the renderer disagree on IR types.
      wgpu:
        patterns: ["wgpu*", "naga"]
    ignore:
      # secp256k1 is pinned to the 0.29 line that rust-nostr 0.44 depends on;
      # bumping it alone puts two secp256k1 versions in the graph and breaks
      # the types handed to nostr. Lift when nostr moves.
      - dependency-name: "secp256k1"
        versions: [">=0.30"]
      # bincode encodes WorldSave, protocol packets and several stores. 2.x/3.x
      # change the API and the encoding, so a bump is a planned save/wire
      # migration (with legacy-save tests), never a routine update.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # wgpu/naga majors change the renderer API and need a visual check on
      # real GPUs (native + WebGPU). Do them as a planned migration.
      - dependency-name: "wgpu*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "naga"
        update-types: ["version-update:semver-major"]
