name: Signet Compatibility
run-name: ${{ inputs.signet_login_candidate == 'true' && format('Signet compatibility sha={0} version={1} request={2}', inputs.signet_login_sha || inputs.signet_login_ref || 'main', inputs.signet_login_package_version, inputs.request_id) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      signet_login_ref:
        description: Upstream Git ref for request provenance only; source is never fetched
        required: false
        type: string
      signet_login_sha:
        description: Upstream commit SHA for request provenance only; source is never fetched
        required: false
        type: string
      signet_login_candidate:
        description: Check an exact published Signet Login npm candidate
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      signet_login_package_version:
        description: Exact published npm version (required for a candidate)
        required: false
        type: string
      request_id:
        description: Compatibility request id
        required: false
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Select the published Signet Login package
        # Dispatch values remain opaque environment values, never shell source.
        env:
          SIGNET_LOGIN_CANDIDATE: ${{ inputs.signet_login_candidate }}
          SIGNET_LOGIN_PACKAGE_VERSION: ${{ inputs.signet_login_package_version }}
        run: |
          VERSION="$(node --input-type=module -e "import { selectedVersion } from './tools/sites/signet-login-package.mjs'; console.log(selectedVersion())")"
          echo "SIGNET_LOGIN_PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Vendor the published npm candidate (console only)
        if: ${{ inputs.signet_login_candidate == 'true' }}
        run: node tools/sites/vendor-signet-login.mjs --strict

      - name: Check Signet Login package tooling
        run: node --test tools/sites/test-signet-login-package.mjs tools/sites/console/test-console-login.mjs

      - name: Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-28)
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: game/engine

      - name: Install trunk
        # sha256-verified before extraction — see deploy.yml for the pin-bump note.
        run: |
          TRUNK_SHA256=f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz -o trunk.tar.gz
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar -xzf trunk.tar.gz -C "$HOME/.cargo/bin" trunk
          rm -f trunk.tar.gz
          trunk --version

      - name: Check Signet Login bundle drift
        run: node tools/sites/check-signet-login-bundle.mjs tools/sites/console/static/vendor/signet-login.iife.js

      - name: Build WASM bundle
        working-directory: game/engine
        run: trunk build --release
